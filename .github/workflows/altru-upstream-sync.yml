name: Upstream sync

# Weekly: fast-forward `master` to nesquena/hermes-webui and open (or refresh)
# a pull request that merges it into `altur-branding`. Merging that PR is a
# reviewed, manual step: see docs/ALTUR.md "Upstream updates".

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Fast-forward master from upstream
        run: gh api -X POST "repos/$REPO/merge-upstream" -f branch=master

      - name: Open or refresh the upstream merge PR
        run: |
          behind=$(gh api "repos/$REPO/compare/altur-branding...master" -q .ahead_by)
          echo "altur-branding is $behind upstream commits behind master" >> "$GITHUB_STEP_SUMMARY"
          [ "$behind" -gt 0 ] || exit 0
          existing=$(gh pr list -R "$REPO" --base altur-branding --head master --state open --json number -q '.[0].number')
          body="master is $behind commits ahead of altur-branding.

          Merge locally following docs/ALTUR.md (Upstream updates): resolve conflicts keeping Altru naming, run scripts/generate-branding.py and the test suite, then push to this branch's merge commit."
          if [ -n "$existing" ]; then
            gh pr edit "$existing" -R "$REPO" --body "$body"
          else
            gh pr create -R "$REPO" --base altur-branding --head master \
              --title "Merge upstream hermes-webui ($behind commits)" --body "$body"
          fi
