name: Upstream check

# Weekly: compare altur-branding with upstream nesquena/hermes-webui. The run
# FAILS when altur-branding is behind, so GitHub notifies the repo owner.
# Merging is a reviewed, manual step: see docs/ALTUR.md "Upstream updates".
# (Updating `master` needs workflow-file permission the built-in token does not
# have; sync it with `gh repo sync mygsunny/Altur-Agent-WebUI --branch master`.)

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Compare altur-branding with upstream master
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          behind=$(gh api "repos/nesquena/hermes-webui/compare/${owner}:altur-branding...master" -q .ahead_by)
          echo "altur-branding is $behind upstream commits behind nesquena/hermes-webui master." | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$behind" -gt 0 ]; then
            echo "::error::altur-branding is $behind commits behind upstream. Merge it on a branch following docs/ALTUR.md (Upstream updates)."
            exit 1
          fi
